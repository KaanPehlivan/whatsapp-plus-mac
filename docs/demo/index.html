<!doctype html>
<!-- Demo page for README screenshots (WAPLUS_DEMO=docs/demo). Made-up people and messages. It mirrors the few hooks
     of WhatsApp Web that navy.css and main.swift use (data-testids, navbar buttons, chat rows, --WDS-* colors), so the
     screenshots show the app's real theme, greeting and hidden items. Default colors are WhatsApp's dark grey and green. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>WhatsApp</title>
<style>
  :root {
    --WDS-surface-default: #161717; --WDS-background-wash-plain: #161717; --WDS-surface-elevated-default: #1d1f1f;
    --WDS-components-surface-nav-bar: #1d1f1f; --WDS-systems-chat-background-wallpaper: #161717;
    --WDS-systems-chat-surface-composer: #242626; --WDS-systems-bubble-surface-incoming: #242626;
    --WDS-systems-bubble-surface-outgoing: #144d37; --WDS-systems-bubble-surface-system: #1d1f1f;
    --WDS-content-default: #fafafa; --WDS-content-deemphasized: rgba(255,255,255,.6); --WDS-accent: #21c063;
    --WDS-content-on-accent: #0a0a0a; --WDS-components-filter-surface-selected: #103529;
    --WDS-persistent-activity-indicator: #25d366; --WDS-content-read: #53bdeb;
    --line: rgba(255,255,255,.08); --row: rgba(255,255,255,.08);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--WDS-content-default);
         background: var(--WDS-surface-default); overflow: hidden; -webkit-font-smoothing: antialiased; }
  #app { display: flex; height: 100%; }
  svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  /* left bar */
  .rail { width: 64px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 0;
          background: var(--WDS-components-surface-nav-bar); border-right: 1px solid var(--line); }
  .rail button { width: 40px; height: 40px; border: 0; border-radius: 50%; background: none; color: var(--WDS-content-deemphasized);
                 display: grid; place-items: center; }
  .rail button.on { background: var(--row); color: var(--WDS-content-default); }
  .rail .grow { flex: 1; }
  .me { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 13px;
        background: #5b7cc4; color: #fff; }

  /* chat list */
  #side { width: 400px; flex: none; display: flex; flex-direction: column; background: var(--WDS-surface-default);
          border-right: 1px solid var(--line); }
  header[data-testid="chatlist-header"] { display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 10px 20px; }
  header[data-testid="chatlist-header"] h2 { font-size: 22px; font-weight: 700; }
  .tools { display: flex; gap: 14px; align-items: center; color: var(--WDS-content-deemphasized); }
  .new { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--WDS-accent);
         color: var(--WDS-content-on-accent); }
  .search { margin: 4px 16px 10px; height: 40px; border-radius: 20px; background: var(--WDS-surface-elevated-default);
            display: flex; align-items: center; gap: 10px; padding: 0 14px; color: var(--WDS-content-deemphasized); }
  .search svg { width: 18px; height: 18px; }
  .chips { display: flex; gap: 8px; padding: 0 16px 10px; }
  .chips span { padding: 6px 12px; border-radius: 16px; border: 1px solid var(--line); color: var(--WDS-content-deemphasized); font-size: 13px; }
  .chips span.on { background: var(--WDS-components-filter-surface-selected); color: var(--WDS-content-default); border-color: transparent; }
  [data-testid="chat-list"] { overflow: hidden; padding: 0 8px; }
  .row { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; }
  .row[aria-selected="true"] { background: var(--row); }
  .av { width: 48px; height: 48px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 600; color: #fff; font-size: 16px; }
  .txt { flex: 1; min-width: 0; }
  .top, .bottom { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .name { font-size: 16px; }
  .time { font-size: 12px; color: var(--WDS-content-deemphasized); }
  .time.new-msg { color: var(--WDS-persistent-activity-indicator); }
  .msg { color: var(--WDS-content-deemphasized); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; font-size: 12px; font-weight: 600; display: grid; place-items: center;
           background: var(--WDS-persistent-activity-indicator); color: var(--WDS-content-on-accent); }
  .tick { color: var(--WDS-content-read); margin-right: 3px; }

  /* conversation */
  #main { flex: 1; display: flex; flex-direction: column; background: var(--WDS-systems-chat-background-wallpaper); }
  .head { display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: var(--WDS-surface-default); border-bottom: 1px solid var(--line); }
  .head .av { width: 40px; height: 40px; font-size: 14px; }
  .head .who { flex: 1; } .head .sub { font-size: 12px; color: var(--WDS-content-deemphasized); }
  .head .tools { gap: 20px; }
  .msgs { flex: 1; display: flex; flex-direction: column; gap: 6px; padding: 22px 64px; justify-content: flex-end; }
  .day { align-self: center; font-size: 12px; padding: 5px 12px; border-radius: 8px; background: var(--WDS-systems-bubble-surface-system);
         color: var(--WDS-content-deemphasized); margin-bottom: 8px; }
  .b { max-width: 62%; padding: 7px 10px 6px; border-radius: 10px; font-size: 14.5px; position: relative; }
  .b.in { align-self: flex-start; background: var(--WDS-systems-bubble-surface-incoming); border-top-left-radius: 4px; }
  .b.out { align-self: flex-end; background: var(--WDS-systems-bubble-surface-outgoing); border-top-right-radius: 4px; }
  .b small { float: right; margin: 6px 0 -4px 12px; font-size: 11px; color: var(--WDS-content-deemphasized); }
  .b.out small .tick { color: var(--WDS-content-read); }
  .comp { display: flex; align-items: center; gap: 14px; margin: 0 14px 14px; padding: 8px 14px; border-radius: 26px;
          background: var(--WDS-systems-chat-surface-composer); color: var(--WDS-content-deemphasized); }
  .comp .field { flex: 1; }
  section[data-testid="intro-panel"] { flex: 1; display: grid; place-items: center; background: var(--WDS-surface-default); }
  .promo { padding: 40px 56px; border-radius: 24px; background: var(--WDS-surface-elevated-default); text-align: center; }
</style>
</head>
<body>
<div id="app" data-testid="wa-web-main-screen">
  <nav class="rail">
    <div><button data-navbar-item aria-label="Chats" class="on"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 1 3.6 6.7L4 20l1.3-3.5A8 8 0 0 1 4 12z"/></svg></button></div>
    <div><button data-navbar-item aria-label="Calls"><svg viewBox="0 0 24 24"><path d="M6.6 3.5h2.6l1.4 4-2 1.3a10.5 10.5 0 0 0 6.6 6.6l1.3-2 4 1.4v2.6a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.6 5.7a2 2 0 0 1 2-2.2z"/></svg></button></div>
    <div><button data-navbar-item aria-label="Status"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" stroke-dasharray="4 2.6"/><circle cx="12" cy="12" r="4.5"/></svg></button></div>
    <div><button data-navbar-item aria-label="Channels"><svg viewBox="0 0 24 24"><path d="M4 10v4l12 5V5zM16 9a3 3 0 0 1 0 6"/></svg></button></div>
    <div><button data-navbar-item aria-label="Communities"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3"/><circle cx="16.5" cy="10" r="2.4"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M14 19a4.4 4.4 0 0 1 7 0"/></svg></button></div>
    <div><button data-navbar-item aria-label="Meta AI"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></button></div>
    <div class="grow"></div>
    <div><button data-navbar-item aria-label="Media"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 16l5-5 4 4 2-2 5 5"/></svg></button></div>
    <div><button data-navbar-item aria-label="You"><span class="me">A</span></button></div>
  </nav>

  <div id="side">
    <header data-testid="chatlist-header">
      <h2><span>WhatsApp</span></h2>
      <div class="tools">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="18.5" r="1"/></svg>
        <span class="new"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></span>
      </div>
    </header>
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/></svg>Search or start a new chat</div>
    <div class="chips"><span class="on">All</span><span>Unread</span><span>Favorites</span><span>Groups</span></div>
    <div data-testid="chat-list" role="grid" id="list"></div>
  </div>

  <div id="right" style="flex:1;display:flex"></div>
</div>

<script>
const a = Number(new URLSearchParams(location.search).get('a') || 0);
const colors = ['#c2547a', '#4f83ff', '#2f9e8f', '#d08a3c', '#7c5cc4', '#3a8fc9', '#b0574f', '#5a9e4b'];
const accounts = [
  { title: '(3) WhatsApp', open: 0, chats: [
    ['Elif Kaya', 'You: Perfect, see you at 8 🍝', '19:42', 0, true],
    ['Family', 'Mom: Who is bringing dessert on Sunday?', '19:15', 2],
    ['Selin', 'Sent the photos from the trip', '18:03', 1],
    ['Can Demir', 'Haha that was legendary', '17:28', 0],
    ['Book Club', 'Deniz: Next pick is “The Overstory”', 'Yesterday', 0],
    ['Mert', 'You: Thanks, got it!', 'Yesterday', 0, true],
    ['Running Crew', 'Sunday 8:00 at the park?', 'Tuesday', 0],
  ], messages: [
    ['day', 'Today'],
    ['in', 'Are we still on for dinner on Friday?', '19:31'],
    ['out', 'Yes! I booked a table at Trattoria for 8', '19:33'],
    ['in', 'Amazing 😍 should I invite Selin too?', '19:36'],
    ['out', 'Of course, the more the merrier', '19:38'],
    ['in', 'Done, she’s in. Pasta night it is!', '19:41'],
    ['out', 'Perfect, see you at 8 🍝', '19:42'],
  ] },
  { title: 'WhatsApp', open: -1, chats: [
    ['Design Team', 'Ayşe: New mockups are in the folder', '18:50', 0],
    ['Lumen Studio', 'You: Invoice sent, thanks!', '17:12', 0, true],
    ['Ops', 'Deploy finished without issues', '16:40', 0],
    ['Ahmet (Client)', 'Can we move the call to Thursday?', '15:05', 0],
    ['Weekly Sync', 'Notes from today are pinned', 'Monday', 0],
  ] },
  { title: '(1) WhatsApp Business', open: -1, chats: [
    ['Lumen Studio', 'Can we move the review to 3 pm?', '19:44', 1],
    ['Orders', 'New order #2041 received', '18:22', 0],
    ['Support', 'You: Happy to help!', '16:10', 0, true],
  ] },
][a] || { title: 'WhatsApp', open: -1, chats: [] };

document.title = accounts.title;
const initials = n => n.split(' ').filter(w => /^[A-Za-zÇĞİÖŞÜçğıöşü]/.test(w)).map(w => w[0]).slice(0, 2).join('');
document.getElementById('list').innerHTML = accounts.chats.map(([name, msg, time, unread, sent], i) => `
  <div role="row"><div role="gridcell"><div class="row" aria-selected="${i === accounts.open}">
    <div class="av" style="background:${colors[(i + a * 3) % colors.length]}">${initials(name)}</div>
    <div class="txt"><div class="top"><span class="name">${name}</span><span class="time${unread ? ' new-msg' : ''}">${time}</span></div>
      <div class="bottom"><span class="msg">${sent ? '<span class="tick">✓✓</span>' : ''}${msg}</span>${unread ? `<span class="badge">${unread}</span>` : ''}</div></div>
  </div></div></div>`).join('');

const right = document.getElementById('right');
if (accounts.open >= 0) {
  const [name] = accounts.chats[accounts.open];
  right.innerHTML = `<div id="main">
    <div class="head"><div class="av" style="background:${colors[(accounts.open + a * 3) % colors.length]}">${initials(name)}</div>
      <div class="who"><div>${name}</div><div class="sub">online</div></div>
      <div class="tools"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="12" height="10" rx="2"/><path d="M15 10.5l6-3.5v10l-6-3.5"/></svg>
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/></svg>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="18.5" r="1"/></svg></div></div>
    <div class="msgs">${accounts.messages.map(([kind, text, time]) => kind === 'day' ? `<div class="day">${text}</div>`
      : `<div class="b ${kind}">${text}<small>${time}${kind === 'out' ? ' <span class="tick">✓✓</span>' : ''}</small></div>`).join('')}</div>
    <div class="comp"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg><span class="field">Type a message</span>
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></div>
  </div>`;
} else {
  // WhatsApp's start screen with a promo card; navy.css empties it.
  right.innerHTML = `<section data-testid="intro-panel"><div class="promo">Download WhatsApp for Mac<br><br>Make calls and get a faster experience</div></section>`;
}

// The third number gets a new message a few seconds in, to show a notification banner.
if (a === 2) setTimeout(() => new Notification('Lumen Studio', { body: 'Can we move the review to 3 pm?', tag: 'lumen' }), 4000);
</script>
</body>
</html>
